# Pull requests: format check, validate, offline tests, then a plan for int (and qa if enabled).
# The plan is posted as a PR comment. Nothing is changed in AWS or Databricks.
name: platform-ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.5"

jobs:
  checks:
    name: fmt, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: validate + terraform test (mocked providers, no cloud access)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          scripts/check.sh

  plan:
    name: plan (${{ matrix.environment }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Repository variable PLAN_ENVIRONMENTS, for example ["int","qa"]. Default: int only.
        environment: ${{ fromJSON(vars.PLAN_ENVIRONMENTS || '["int"]') }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ENV_NAME: ${{ matrix.environment }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: plan 1-infra
        run: scripts/tf.sh plan "$ENV_NAME" 1-infra

      - name: plan 2-workspace
        run: scripts/tf.sh plan "$ENV_NAME" 2-workspace

      - name: plan 3-teams
        run: scripts/tf.sh plan "$ENV_NAME" 3-teams

      - name: Post plan to the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const marker = `<!-- platform-plan-${env} -->`;
            let body = `${marker}\n### Terraform plan: \`${env}\`\n\n`;
            for (const stack of ['1-infra', '2-workspace', '3-teams']) {
              const file = `.plans/${env}-${stack}.txt`;
              if (!fs.existsSync(file)) { body += `**${stack}**: plan failed, see [the run](${process.env.RUN_URL}).\n\n`; continue; }
              const text = fs.readFileSync(file, 'utf8');
              const summary = (text.match(/^(Plan:.*|No changes\..*|Skipped:.*)$/m) || ['(see run)'])[0];
              const shown = text.length > 20000 ? text.slice(0, 20000) + '\n... (truncated, full plan in the run log)' : text;
              body += `<details><summary><b>${stack}</b>: ${summary}</summary>\n\n\`\`\`\n${shown}\n\`\`\`\n</details>\n\n`;
            }
            body += `Merging to \`main\` applies this to \`int\`. [Run](${process.env.RUN_URL})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
